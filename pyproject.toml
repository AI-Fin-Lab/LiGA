[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liga-forecasting"
version = "0.1.0"
description = "Research reference implementation of Lifecycle-Aligned Multi-View Graph Augmentation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "LiGA Contributors"}]
dependencies = ["numpy>=1.23", "pandas>=1.5", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
